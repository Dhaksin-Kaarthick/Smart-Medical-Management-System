name: smart_medical_management
description: "Smart Medical Management System - IoT-Based Medicine Reminder and AI-Powered Patient Monitoring"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Services
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_messaging: ^14.9.1
  
  # State Management & DI
  provider: ^6.1.2
  
  # Utilities & Formatting
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  
  # UI & Charts
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
